name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      # The Go that builds the Go implementation is the one go/go.mod declares
      # in its toolchain line. rlsbl monorepo sync prefixes this path with the
      # member path (conformance/), so `../go/go.mod` resolves to go/go.mod.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ../go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build TypeScript implementation
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - name: Install strictcli and conformance tool
        working-directory: .
        run: |
          pip install -e ./python --break-system-packages
          pip install -e ./conformance --break-system-packages
      - name: Conformance checks
        run: conformance check --tag pre-release
