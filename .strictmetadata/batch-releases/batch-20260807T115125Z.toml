format_version = 2
[releasables.py-strictcli]
bump = "minor"
description = "Adds the `dry_run_supported=False` command declaration -- a mutating command can now refuse `--dry-run` with a mandatory reason carried into help and the schema -- and corrects a Python README that documented a handler signature, a check API and a dependency claim the framework no longer has."
context = '''
`--dry-run` is a promise: the preview must describe what the real run would do.
Some mutating commands cannot keep that promise, because their effects are not
representable ahead of time. Until now such a command either rendered a preview
that misrepresented it or hand-rolled a refusal inside the handler -- after
parsing, invisible to `--help` and to `--dump-schema`. `dry_run_supported` moves
the refusal to the registration site, where the framework can enforce it: the
reason is mandatory, it is rendered in a dedicated `Dry run:` help section, it is
emitted in the schema, and declaring it on a `read_only` command is a
registration-time error (a command that changes nothing has nothing to preview).

The same release completes a documentation truth pass. Every registration example
was re-checked against the shipped API, and the reserved flag quartet, the effects
regime and the `consequential` confirm protocol -- previously explained nowhere --
are now documented. Examples are no longer trusted by inspection: the
self-contained example programs are marked `validate`, and `selfdoc check` now
assembles and RUNS each one against the checkout, so documentation that stops
working fails the release rather than rotting quietly.
'''
include = ["pypi"]
exclude = []

