format_version = 2
[releasables.py-strictcli]
bump = "minor"
description = "Consequential commands now require explicit consent on the programmatic and MCP channels, tool descriptors publish their effects classification, and `approve_consequential` becomes a reserved parameter name."
context = """
The confirmation requirement was a CLI-only property: a command marked
`consequential` prompted (or refused) when it was reached through argv, but the
same command was reachable with no consent at all through `as_tools()`,
`call()`, `acall()`, `Tool.execute` and MCP `tools/call`. An agent driving the
app over MCP therefore ran exactly the commands the requirement exists to stop
for a human decision. This release makes consent a property of the command
rather than of the channel: every call path refuses a `consequential` command
unless the caller states consent, and the descriptors published to tool and MCP
consumers carry `effect` and `consequential` so a caller can see the
requirement before it calls.

Reserving `approve_consequential` follows from that. The name is now framework
vocabulary in all three implementations, so a command declaring its own flag or
positional arg of that name would shadow the consent parameter -- and in Python
a positional arg of that name was already unreachable over `call()` while the
same command stayed callable over MCP. Registration now rejects it outright.

Both changes are breaking, which under pre-1.0 versioning is a minor bump. The
three implementations ship the same behavior in lockstep, verified by the
conformance suite.
"""
include = ["pypi"]
exclude = []

[releasables.go-strictcli]
bump = "minor"
description = "Consequential commands now require explicit consent on the programmatic and MCP channels, tool descriptors publish their effects classification, `approve_consequential` becomes a reserved parameter name, and tool/MCP output emits empty JSON arrays instead of `null`."
context = """
The confirmation requirement was a CLI-only property: a command marked
`Consequential` prompted (or refused) when it was reached through argv, but the
same command was reachable with no consent at all through `AsTools()`,
`Call()`, `Tool.Execute` and MCP `tools/call`. An agent driving the app over
MCP therefore ran exactly the commands the requirement exists to stop for a
human decision. This release makes consent a property of the command rather
than of the channel: every call path refuses a `Consequential` command unless
the caller states consent, and the descriptors published to tool and MCP
consumers carry `effect` and `consequential` so a caller can see the
requirement before it calls. `App.Call` and `Tool.Execute` are variadic in
`CallOption` to carry `WithApproveConsequential()`.

Reserving `approve_consequential` follows from that: the name is now framework
vocabulary in all three implementations, so no command may redefine it.

The `null`-instead-of-`[]` fix is a Go-only divergence found while covering the
MCP channel in the conformance suite -- Go emitted `"required": null` and
`"tools": null`, which is neither valid JSON Schema nor what Python and
TypeScript emit.

The breaking changes are a minor bump under pre-1.0 versioning. The three
implementations ship the same behavior in lockstep, verified by the conformance
suite.
"""
include = ["go"]
exclude = []

