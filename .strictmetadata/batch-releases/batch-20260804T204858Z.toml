format_version = 2
[releasables.py-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Confirmation keys on a declared `consequential`, not on `mutating`"
# Optional context explaining why these changes were made
context = """
The shipped regime INFERRED "mutating => must confirm". Adoption across six
consumers falsified that inference by an order of magnitude: 391 of 624
commands (63%) classify `mutating`, so two thirds of every CLI in the fleet
prompted -- including `safegit commit`, `rlsbl changelog add`, `selfdoc gen`,
`saferm delete` (the safe, undoable deletion) and `claudewheel launch`, which
had to be special-cased or every session would have opened with a
`Proceed? [y/N]`. The genuinely dangerous commands are roughly 5-10% of that
set: a ~1:10 signal-to-noise ratio, which guarantees the skip flag gets passed
reflexively and leaves the guardrail dead while it still looks present.

The diagnosis: one field was answering two questions. `effect` correctly
answers "should a dry run record rather than execute?" -- that is working and
is unchanged. Consequence asks "are these effects worth interrupting someone
for?" Almost everything has effects; very little is consequential. `effect` was
only ever a proxy for the second question, and the proxy is off by 10x.

Commands now declare `consequential=True` and the framework prompts for those
and no others. The declaration is deliberately named after a property of the
COMMAND rather than after the framework's reaction, so other behaviours can
hang off the same fact later. The skip flag `--approve-consequential` is
deliberately unwieldy: a flag that cannot become muscle memory stays a
decision. `yes` stays on the banned-names list so nobody reintroduces a private
`--yes` meaning the same thing.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["pypi"]
exclude = []

[releasables.go-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Confirmation keys on a declared `consequential`, not on `mutating`"
# Optional context explaining why these changes were made
context = """
The shipped regime INFERRED "mutating => must confirm". Adoption across six
consumers falsified that inference by an order of magnitude: 391 of 624
commands (63%) classify `mutating`, against roughly 5-10% that are genuinely
dangerous -- a ~1:10 signal-to-noise ratio that guarantees the skip flag gets
passed reflexively and leaves the guardrail dead while it still looks present.

One field was answering two questions. `effect` correctly answers "should a dry
run record rather than execute?" -- unchanged. Consequence asks "are these
effects worth interrupting someone for?", which almost nothing answers yes to.
Commands now declare it with `WithConsequential()`.

This release also fixes a Go-only parity break the new conformance coverage
surfaced: `/dev/null` is a character device, so Go's TTY check read a null
stdin as interactive where Python and TypeScript read it as non-interactive.
The same invocation prompted on Go and hard-errored on the other two.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["go"]
exclude = []

