format_version = 2
[releasables.py-strictcli]
bump = "minor"
description = "Receiver-aware `effects-bypass` lint: `platform.system()` is no longer a false positive, and aliased or from-imported receivers are now caught."
context = """
The `effects-bypass` check matched bare leaf names, so any call named `system` was
reported as an escaped effect -- including `platform.system()`, a pure in-process
read whose suggested remediation could not be followed. The leaf is now a finding
only through the `os` receiver (`os.system`, `import os as o`, `from os import
system`).

Resolution runs through the module's own imports, which also closes the opposite
gap: `import requests as rq` + `rq.post(...)` and `from subprocess import run` +
`run(...)` were previously missed and are now caught. Builtin `open` is answered
before import resolution so it keeps its own verdict.

Consumers pick the fix up on their next lock bump.
"""
include = ["pypi"]
exclude = []

[releasables.ts-strictcli]
bump = "minor"
description = "Receiver-aware `effects-bypass` lint: `RegExp.prototype.exec` is no longer a false positive."
context = """
The `effects-bypass` check matched the bare leaf name `exec`, so `pattern.exec(line)`
in a handler was reported as an escaped effect. The leaf is now a finding only bare
or through a child_process receiver (`cp`, `childProcess`, `child_process`, `execa`,
`shelljs`), matching the receiver-aware resolution on the Python side.

Consumers pick the fix up on their next lock bump.
"""
include = ["npm"]
exclude = []

# go-strictcli: no unreleased commits since go/v0.30.0
