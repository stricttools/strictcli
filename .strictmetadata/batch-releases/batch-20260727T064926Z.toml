format_version = 2
[releasables.py-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Connection env vars: a hermetic-suppressed, app-level env primitive for connection URLs"
# Optional context explaining why these changes were made
context = "Adds a third infra-env kind alongside infra roots and handshake vars. A connection env (e.g. a database DSN) is declared once at app level, read lazily with no default, and suppressed under --hermetic so connection-dependent behavior (including checks) skips visibly. Flags bind to it by reference and check functions can read it through the check context."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
include = ["pypi"]
exclude = []

[releasables.go-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Connection env vars: a hermetic-suppressed, app-level env primitive for connection URLs"
# Optional context explaining why these changes were made
context = "Adds a third infra-env kind alongside infra roots and handshake vars. A connection env (e.g. a database DSN) is declared once at app level via WithConnectionEnv, read lazily with no default, and suppressed under --hermetic so connection-dependent behavior (including checks) skips visibly. Flags bind to it via ConnectionURLFlag and check functions can read it through the ConnectionEnvReader capability."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
include = ["go"]
exclude = []

[releasables.ts-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Connection env vars: a hermetic-suppressed, app-level env primitive for connection URLs"
# Optional context explaining why these changes were made
context = "Adds a third infra-env kind alongside infra roots and handshake vars. A connection env (e.g. a database DSN) is declared once at app level via createApp connectionEnv, read lazily with no default, and suppressed under --hermetic so connection-dependent behavior (including checks) skips visibly. Flags bind to it via connectionUrl/connectionEnv and check functions can read it through the ConnectionEnvReader capability."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
