format_version = 2
[releasables.py-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Dry-run previews render on every exit path out of a handler"
# Optional context explaining why these changes were made
context = """A consumer migrating onto the effects regime found that a dry-run preview vanished whenever the handler left through anything other than a normal return. The would-do log was rendered only on the success path, so a handler that recorded its intended writes and then exited non-zero -- the ordinary shape of a validation command -- printed nothing at all. Safety was never at risk (dry mode still executed nothing), but the preview property was: silence is indistinguishable from 'this command would do nothing', and those runs are exactly the ones a reader most wants to see. The render is now owned by the single seam every dispatch already passes through in each language, so it cannot be missed by a path that forgets to call it. An unexpected crash still renders what was recorded, followed by a new stderr marker saying the preview may be incomplete; the exception itself is never swallowed. A handler that terminates the process itself (Go os.Exit, Node process.exit) remains outside the guarantee and is recorded as a ceiling in the effects contract."""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["pypi"]
exclude = []

