# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["npm"]
exclude = []
description = "Adds the `dryRunSupported: false` command declaration -- a mutating command can now refuse `--dry-run` with a mandatory reason carried into help and the schema -- generates the exported `VERSION` constant from package.json so it can no longer report a version the package never shipped, and rewrites an npm README usage example that did not compile."
context = "`--dry-run` is a promise: the preview must describe what the real run would do.\nSome mutating commands cannot keep that promise, because their effects are not\nrepresentable ahead of time. Until now such a command either rendered a preview\nthat misrepresented it or hand-rolled a refusal inside the handler -- after\nparsing, invisible to `--help` and to `--dump-schema`. `dryRunSupported` moves the\nrefusal to the registration site on both twin factories and both passthrough\ntwins, where the framework can enforce it: the reason is mandatory, it is rendered\nin a dedicated `Dry run:` help section, it is emitted in the schema, and declaring\nit on a `read_only` command throws at registration (a command that changes nothing\nhas nothing to preview).\n\n`VERSION` was a hand-written literal with a test pinning that literal, so the test\nprotected the drift instead of catching it. It is now generated from package.json\nby the prebuild hook that `prepack` inherits, and the test asserts agreement with\nthe manifest rather than a constant.\n\nThe same release completes a documentation truth pass. Every registration example\nwas re-checked against the shipped API, and the reserved flag quartet, the effects\nregime and the `consequential` confirm protocol are now documented. Examples are\nno longer trusted by inspection: the self-contained example programs are marked\n`validate`, and `selfdoc check` now type-checks and RUNS each one against the\nbuilt `dist`, so documentation that stops working fails the release."
release_commit = "0e45de867fff43483ba0881391769842c553d5ba"

