# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["npm"]
exclude = []
description = "Confirmation keys on a declared `consequential`, not on `mutating`"
context = "The shipped regime INFERRED \"mutating => must confirm\". Adoption across six\nconsumers falsified that inference by an order of magnitude: 391 of 624\ncommands (63%) classify `mutating`, against roughly 5-10% that are genuinely\ndangerous -- a ~1:10 signal-to-noise ratio that guarantees the skip flag gets\npassed reflexively and leaves the guardrail dead while it still looks present.\n\nOne field was answering two questions. `effect` correctly answers \"should a dry\nrun record rather than execute?\" -- unchanged. Consequence asks \"are these\neffects worth interrupting someone for?\", which almost nothing answers yes to.\nCommands now declare it with `consequential: true` on the twin-factory options\nobject, and the declaration is named after a property of the COMMAND rather\nthan after the framework's reaction so other behaviours can hang off the same\nfact later."
release_commit = "de835716b9e891787680a8a7b22dac2f37804efc"

