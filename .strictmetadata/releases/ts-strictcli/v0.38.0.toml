# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 2
bump = "minor"
include = ["npm"]
exclude = []
description = "Consequential commands now require explicit consent on the programmatic and MCP channels, tool descriptors publish their effects classification, and `approve_consequential` becomes a reserved parameter name."
context = "The confirmation requirement was a CLI-only property: a command marked\n`consequential` prompted (or refused) when it was reached through argv, but the\nsame command was reachable with no consent at all through `asTools()`,\n`call()`, `Tool.execute` and MCP `tools/call`. An agent driving the app over\nMCP therefore ran exactly the commands the requirement exists to stop for a\nhuman decision. This release makes consent a property of the command rather\nthan of the channel: every call path refuses a `consequential` command unless\nthe caller states consent through the new `CallOptions` argument, and the\ndescriptors published to tool and MCP consumers carry `effect` and\n`consequential` so a caller can see the requirement before it calls.\n\nReserving `approve_consequential` follows from that: the name is now framework\nvocabulary in all three implementations, so no command may redefine it.\n\nBoth changes are breaking, which under pre-1.0 versioning is a minor bump. The\nthree implementations ship the same behavior in lockstep, verified by the\nconformance suite."
release_commit = "f162d4d0a7c49d465c049d640fb4ca60a4b1848e"

