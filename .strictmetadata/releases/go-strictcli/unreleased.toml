# The next release of go-strictcli. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "patch"
# What this release is, in a sentence or two. Required.
description = "A declared HTTP read, `strictcli.Read()`, is refused on any method other than GET, HEAD, or OPTIONS, so a read_only command or a dry run can no longer send a mutating request as a read."
# Why these changes were made. Optional.
context = ""
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = []
