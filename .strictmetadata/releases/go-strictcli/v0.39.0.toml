# The next release of go-strictcli. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "minor"
# What this release is, in a sentence or two. Required.
description = "Adds NewGrant, ErrTimedOut, declared scratch directories (WithScratchDir and ctx.ScratchDir), WithArgsAfterSeparator, HTTP bodies streamed from a file, declared reads, redaction, and the Stdin, Timeout, and Mode effect options; App.Test changes nothing process-wide; test coverage is declared by the source-tree root; the check context factory receives the dispatch's Context; the effects-bypass check skips _test.go files; go-toml-edit is required at its new path."
# Why these changes were made. Optional.
context = ""
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = []
release_commit = "4794b948639c95213e40a58c7f0c4c403c43aea4"
[released_trees]
go = "5adcf4ad16e22e54e8e2ebb4eeb4e809f6469aa7"
