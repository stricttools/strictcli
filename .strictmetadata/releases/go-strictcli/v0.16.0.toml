description = "Command declaration framework: structured handler returns, programmatic invocation, typed args, config fields, compound types, tool export, MCP projection, and scope-based check filtering."
context = "This release transforms strictcli from a CLI framework into a command declaration framework with multiple output projections. Commands declared once can be invoked via CLI (existing), programmatic API (App.Call), tool export (AsTools with JSON Schema), and MCP server (--mcp flag).\n\nKey additions: DataCommand/HandlerResult for structured returns, typed positional args with choices, first-class ConfigField declarations with per-command binding and startup validation, compound types (ListOf/DictOf), command visibility (Hidden/Interactive), schema enrichment with versioning and constraint serialization, and declarative scope field on check definitions with SetScopeAdapter() for context-dependent pre-check filtering."
release_commit = "c5202dce665e31eeaee46a5491158f9d919e1701"

