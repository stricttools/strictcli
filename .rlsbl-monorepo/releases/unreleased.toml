[releasables.py-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Retired choices on value flags and positional args."
# Optional context explaining why these changes were made
context = "A value flag or positional arg that declares choices may now also declare the spellings it used to accept, so a renamed value is refused with a message naming its replacement instead of the generic invalid-value error. The three implementations ship it together, each in its own declaration shape, with conformance cases covering every target."
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["pypi"]
exclude = []

[releasables.go-strictcli]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Retired choices on value flags and positional args, plus the module path move to github.com/stricttools/strictcli/go."
# Optional context explaining why these changes were made
context = "A value flag or positional arg that declares choices may now also declare the spellings it used to accept, so a renamed value is refused with a message naming its replacement instead of the generic invalid-value error. The three implementations ship it together, each in its own declaration shape, with conformance cases covering every target. This release also carries a breaking change for Go consumers alone: the repository was transferred from the smm-h account to the stricttools organisation, so the module declares github.com/stricttools/strictcli/go and the old github.com/smm-h/strictcli/go is no longer served. Consumers change their import, their go.mod requirement, and their go get invocation to the new path."
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["go"]
exclude = []

